name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-v3.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: gnosis-vpn-testenv
      conflict_markers: true
      pre_commit: false
      lint: false
      deps: false
      audit: false
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  scripts-tests:
    name: Script tests
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Run bats suite
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_cache_name: gnosis-vpn-testenv
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: nix develop -c just test-scripts
  ci-ok:
    name: CI OK
    # Single required status check: stable across matrix expansion and label gating.
    if: always() # a skipped job counts as passing, so never let a failed dependency skip this one
    needs: [checks, scripts-tests]
    runs-on: depot-ubuntu-22.04-4
    permissions: {}
    steps:
      - name: Fail if any CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
